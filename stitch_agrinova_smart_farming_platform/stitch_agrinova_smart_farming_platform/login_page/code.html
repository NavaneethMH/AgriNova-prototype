                    "borderRadius": {

                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sidebar-width": "280px",
                        "gutter": "16px",
                        "base": "8px",
                        "container-padding": "24px",
                        "section-gap": "32px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-shadow {
            box-shadow: 0 10px 40px -10px rgba(13, 99, 27, 0.08);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row antialiased">
<!-- Split Layout: Left/Top Illustration -->
<div class="md:w-1/2 lg:w-3/5 relative h-64 md:h-screen flex-shrink-0 bg-surface-container overflow-hidden rounded-b-3xl md:rounded-none md:rounded-r-[2rem] z-10 shadow-lg">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A highly realistic, wide-angle aerial view of vibrant, geometric farm fields being scanned by a futuristic, sleek satellite in orbit. The scene is bathed in a serene, bright morning light with a modern, high-tech aesthetic. The color palette features rich organic greens of the crops contrasting against the pristine white and metallic textures of the satellite, evoking a sense of precision agriculture and advanced AI technology in a calm, clear atmosphere." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDLE5Gw9o2JcwVA4qWbR0UbYSt7OeFMSnZ528JGVAFyAGXpV708VhvhOJViT2ZJ8T7KcgzYbLm047-NVHqAZPRN0sF10xi92oG7YGvXdUoOhF5VwIrGCNkg0H7XQWiqAOj5Z05YMgsx3-9qQLpBbudQgiqpNvmzl5TnDCWfQk9VqitmN7gCXZEukDcGQDS7q_icA5XA75bd2xPDzPJNUwULI3lnDHAME6swUL-au6yT8YmNp5dMQxFS')"></div>
<div class="absolute inset-0 bg-gradient-to-t md:bg-gradient-to-r from-black/60 to-transparent flex flex-col justify-end p-8 md:p-16">
<h1 class="font-display-lg text-display-lg text-white mb-4">Precision Ag Intelligence</h1>
<p class="font-body-lg text-body-lg text-white/90 max-w-lg">Transforming complex satellite and sensor data into actionable, serene intelligence for modern farming.</p>
</div>
</div>
<!-- Split Layout: Right/Bottom Content -->
<div class="md:w-1/2 lg:w-2/5 flex flex-col justify-center items-center p-6 md:p-12 relative z-20">
<!-- Login Card -->
<div class="w-full max-w-md bg-surface rounded-[16px] p-8 soft-shadow border border-outline-variant/30 backdrop-blur-sm relative -mt-16 md:mt-0 z-30">
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary-container text-on-primary-container mb-4 shadow-sm">
<span class="material-symbols-outlined text-[28px]" data-icon="psychology">psychology</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your AgriNova dashboard</p>
</div>
<form class="space-y-6">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-xl bg-surface-lowest text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors h-[48px]" id="email" placeholder="admin@agrinova.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-xl bg-surface-lowest text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors h-[48px]" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface" id="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant text-sm" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<!-- Primary Action -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-[12px] shadow-sm font-label-md text-label-md text-white bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98] items-center gap-2" type="submit">
                    Login to Dashboard
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface text-on-surface-variant font-label-sm">Or continue with</span>
</div>
</div>
<div class="mt-6 grid grid-cols-1 gap-3">
<button class="w-full inline-flex justify-center items-center py-3 px-4 border border-outline-variant/50 rounded-[12px] bg-surface-lowest text-on-surface font-label-md text-label-md hover:bg-surface-variant/30 transition-colors">
<svg class="w-5 h-5 mr-2" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.67 15.63 16.89 16.79 15.73 17.57V20.34H19.29C21.38 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.29 20.34L15.73 17.57C14.74 18.23 13.48 18.63 12 18.63C9.13999 18.63 6.72 16.7 5.86 14.09H2.18V16.94C3.99 20.53 7.7 23 12 23Z" fill="#34A853"></path>
<path d="M5.86 14.09C5.64 13.43 5.51 12.73 5.51 12C5.51 11.27 5.64 10.57 5.86 9.91V7.06H2.18C1.43 8.55 1 10.22 1 12C1 13.78 1.43 15.45 2.18 16.94L5.86 14.09Z" fill="#FBBC05"></path>
<path d="M12 5.38C13.62 5.38 15.06 5.94 16.2 7.03L19.37 3.86C17.45 2.06 14.97 1 12 1C7.7 1 3.99 3.47 2.18 7.06L5.86 9.91C6.72 7.3 9.13999 5.38 12 5.38Z" fill="#EA4335"></path>
</svg>
                        Google
                    </button>
</div>
</div>
<p class="mt-8 text-center font-body-md text-sm text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-primary hover:text-primary-container transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
</body></html>
